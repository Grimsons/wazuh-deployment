---
# Wazuh Credential Rotation Playbook
# Safely rotates passwords for Wazuh components with minimal downtime
#
# Usage: ansible-playbook playbooks/rotate-credentials.yml
#
# Optional variables:
#   -e "rotate_api=true"           - Rotate Wazuh API password (default: true)
#   -e "rotate_indexer=true"       - Rotate Indexer admin password (default: true)
#   -e "rotate_authd=true"         - Rotate agent enrollment password (default: false)
#   -e "backup_credentials=true"   - Backup current credentials first (default: true)
#   -e "restart_services=true"     - Restart services after rotation (default: true)
#
# WARNING: This playbook modifies production credentials. Ensure you have:
#   - Current vault password access
#   - A recent backup of credentials
#   - Maintenance window scheduled

- name: Credential Rotation - Preparation
  hosts: localhost
  gather_facts: true
  vars:
    rotate_api: true
    rotate_indexer: true
    rotate_authd: false
    backup_credentials: true
  tasks:
    - name: Display rotation plan
      ansible.builtin.debug:
        msg: |
          Credential Rotation Plan:
          ─────────────────────────
          - Wazuh API password:      {{ 'YES' if rotate_api | bool else 'NO' }}
          - Indexer admin password:  {{ 'YES' if rotate_indexer | bool else 'NO' }}
          - Agent enrollment (authd): {{ 'YES' if rotate_authd | bool else 'NO' }}
          ─────────────────────────
          Backup current credentials: {{ 'YES' if backup_credentials | bool else 'NO' }}

    - name: Confirm rotation
      ansible.builtin.pause:
        prompt: "Press ENTER to continue with credential rotation, or Ctrl+C to abort"
      when: not (skip_confirmation | default(false) | bool)

    - name: Set rotation timestamp
      ansible.builtin.set_fact:
        rotation_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

    - name: Generate new passwords (YAML-safe charset)
      ansible.builtin.shell: |
        source "{{ playbook_dir }}/../lib/generators.sh"
        echo "api_pw=$(generate_yaml_safe_password 24)"
        echo "indexer_pw=$(generate_yaml_safe_password 24)"
        echo "authd_pw=$(generate_yaml_safe_password 24)"
      args:
        executable: /bin/bash
      delegate_to: localhost
      register: _generated_passwords
      changed_when: false
      no_log: true

    - name: Set new password facts
      ansible.builtin.set_fact:
        new_api_password: "{{ _generated_passwords.stdout | regex_search('api_pw=(.+)', '\\1') | first }}"
        new_indexer_password: "{{ _generated_passwords.stdout | regex_search('indexer_pw=(.+)', '\\1') | first }}"
        new_authd_password: "{{ _generated_passwords.stdout | regex_search('authd_pw=(.+)', '\\1') | first }}"
      no_log: true

    - name: Backup current vault
      when: backup_credentials | bool
      block:
        - name: Create vault backup directory
          ansible.builtin.file:
            path: "{{ playbook_dir }}/../backups/vault-{{ rotation_timestamp }}"
            state: directory
            mode: '0700'

        - name: Copy current vault to backup
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../group_vars/all/vault.yml"
            dest: "{{ playbook_dir }}/../backups/vault-{{ rotation_timestamp }}/vault.yml.backup"
            mode: '0600'
          when: (playbook_dir + '/../group_vars/all/vault.yml') is file

- name: Rotate Wazuh API Password
  hosts: wazuh_managers
  become: false
  serial: 1  # One manager at a time for safety
  vars:
    rotate_api: true
    restart_services: true
  tasks:
    - name: Rotate API password
      when: rotate_api | bool
      block:
        - name: Get current API user
          ansible.builtin.set_fact:
            api_user: "{{ wazuh_api_user | default('wazuh') }}"

        # Password update operates on the cluster-wide user store — run once only.
        # Subsequent managers would fail to auth with the old password after the first update.
        - name: Authenticate with Wazuh API (current password)
          ansible.builtin.uri:
            url: "https://{{ ansible_default_ipv4.address }}:{{ wazuh_manager_api_port | default(55000) }}/security/user/authenticate"
            method: POST
            user: "{{ api_user }}"
            password: "{{ wazuh_api_password }}"
            force_basic_auth: true
            validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
            return_content: true
          register: rotation_auth
          no_log: true
          run_once: true
          failed_when: rotation_auth.status != 200

        - name: Extract JWT token for rotation
          ansible.builtin.set_fact:
            rotation_jwt: "{{ (rotation_auth.content | from_json).data.token }}"
          no_log: true
          run_once: true

        - name: Get API user list
          ansible.builtin.uri:
            url: "https://{{ ansible_default_ipv4.address }}:{{ wazuh_manager_api_port | default(55000) }}/security/users"
            method: GET
            headers:
              Authorization: "Bearer {{ rotation_jwt }}"
            validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
            return_content: true
          register: rotation_users
          no_log: true
          run_once: true

        - name: Find API user ID
          ansible.builtin.set_fact:
            rotation_user_id: "{{ (rotation_users.content | from_json).data.affected_items | selectattr('username', 'equalto', api_user) | map(attribute='id') | first }}"
          run_once: true

        - name: Update API user password via REST API
          ansible.builtin.uri:
            url: "https://{{ ansible_default_ipv4.address }}:{{ wazuh_manager_api_port | default(55000) }}/security/users/{{ rotation_user_id }}"
            method: PUT
            headers:
              Authorization: "Bearer {{ rotation_jwt }}"
            body_format: json
            body:
              password: "{{ hostvars['localhost']['new_api_password'] }}"
            validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
            status_code: [200]
          register: api_pw_update
          no_log: true
          run_once: true
          failed_when: api_pw_update.status != 200

        - name: Restart Wazuh Manager
          ansible.builtin.systemd:
            name: wazuh-manager
            state: restarted
          become: true
          when: restart_services | bool

        - name: Wait for API to be available with new password
          ansible.builtin.uri:
            url: "https://{{ ansible_default_ipv4.address }}:{{ wazuh_manager_api_port | default(55000) }}/security/user/authenticate"
            method: POST
            user: "{{ api_user }}"
            password: "{{ hostvars['localhost']['new_api_password'] }}"
            force_basic_auth: true
            validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
            status_code: 200
          register: api_check
          until: api_check.status == 200
          retries: 30
          delay: 5
          no_log: true

- name: Rotate Indexer Admin Password
  hosts: wazuh_indexers[0]  # Primary indexer only
  become: true
  vars:
    rotate_indexer: true
  tasks:
    - name: Rotate indexer admin password
      when: rotate_indexer | bool
      block:
        - name: Generate password hash for indexer
          ansible.builtin.shell: |
            _tmp=$(mktemp /dev/shm/.hash_XXXXXX 2>/dev/null || mktemp)
            chmod 600 "$_tmp"
            printf '%s' "$NEW_PW" > "$_tmp"
            _hash=$(/usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p "$(cat "$_tmp")")
            shred -u "$_tmp" 2>/dev/null || rm -f "$_tmp"
            echo "$_hash"
          args:
            executable: /bin/bash
          environment:
            NEW_PW: "{{ hostvars['localhost']['new_indexer_password'] }}"
          register: password_hash_output
          no_log: true
          changed_when: false

        - name: Extract password hash
          ansible.builtin.set_fact:
            new_password_hash: "{{ password_hash_output.stdout_lines | last }}"
          no_log: true

        - name: Update admin user password in internal_users.yml
          ansible.builtin.replace:
            path: /etc/wazuh-indexer/opensearch-security/internal_users.yml
            regexp: '^(admin:\s*\n\s*hash:\s*)"[^"]*"'
            replace: '\1"{{ new_password_hash }}"'
          no_log: true

        - name: Apply security configuration
          ansible.builtin.command:
            cmd: >
              /usr/share/wazuh-indexer/bin/indexer-security-init.sh
              -cacert /etc/wazuh-indexer/certs/root-ca.pem
              -cert /etc/wazuh-indexer/certs/admin.pem
              -key /etc/wazuh-indexer/certs/admin-key.pem
              -h localhost
          register: security_init
          changed_when: security_init.rc == 0

        - name: Verify new password works
          ansible.builtin.uri:
            url: "https://localhost:9200/_cluster/health"
            method: GET
            user: admin
            password: "{{ hostvars['localhost']['new_indexer_password'] }}"
            force_basic_auth: true
            validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
            status_code: 200
          register: indexer_check
          until: indexer_check.status == 200
          retries: 10
          delay: 5
          no_log: true

- name: Update Dashboard Configuration
  hosts: wazuh_dashboards
  become: true
  vars:
    rotate_indexer: true
    restart_services: true
  tasks:
    - name: Update dashboard with new indexer password
      when: rotate_indexer | bool
      block:
        - name: Update opensearch_dashboards.yml
          ansible.builtin.lineinfile:
            path: /etc/wazuh-dashboard/opensearch_dashboards.yml
            regexp: '^opensearch\.password:'
            line: 'opensearch.password: "{{ hostvars["localhost"]["new_indexer_password"] }}"'
          no_log: true

        - name: Restart Wazuh Dashboard
          ansible.builtin.systemd:
            name: wazuh-dashboard
            state: restarted
          when: restart_services | bool

        - name: Wait for dashboard to be available
          ansible.builtin.uri:
            url: "https://localhost:443/app/wazuh"
            method: GET
            validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
            status_code: 200, 302
          register: dashboard_check
          until: dashboard_check.status in [200, 302]
          retries: 30
          delay: 5

- name: Update Wazuh Manager Keystore After Indexer Rotation
  hosts: wazuh_managers
  become: true
  vars:
    rotate_indexer: true
    restart_services: true
  tasks:
    - name: Update manager keystore with new indexer password
      when: rotate_indexer | bool
      block:
        - name: Store new indexer password in manager keystore
          ansible.builtin.shell: |
            set -o pipefail
            printf '%s' "$NEW_INDEXER_PW" | /var/ossec/bin/wazuh-keystore -f indexer -k password
            HASH_FILE=/var/ossec/etc/.keystore_password_hash
            printf '%s' "$NEW_INDEXER_PW" | sha256sum | cut -d' ' -f1 > "$HASH_FILE"
            chmod 600 "$HASH_FILE"
            chown wazuh:wazuh "$HASH_FILE"
          args:
            executable: /bin/bash
          environment:
            NEW_INDEXER_PW: "{{ hostvars['localhost']['new_indexer_password'] }}"
          no_log: true
          changed_when: true

        - name: Restart Wazuh Manager to pick up new keystore
          ansible.builtin.systemd:
            name: wazuh-manager
            state: restarted
          when: restart_services | bool

- name: Update Filebeat Configuration
  hosts: wazuh_managers
  become: true
  vars:
    rotate_indexer: true
    restart_services: true
  tasks:
    - name: Update filebeat with new indexer password
      when: rotate_indexer | bool
      block:
        - name: Redeploy Filebeat configuration with new indexer password
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/wazuh-manager/templates/filebeat.yml.j2"
            dest: /etc/filebeat/filebeat.yml
            owner: root
            group: root
            mode: '0600'
          vars:
            wazuh_indexer_admin_password: "{{ hostvars['localhost']['new_indexer_password'] }}"
          no_log: true

        - name: Restart Filebeat
          ansible.builtin.systemd:
            name: filebeat
            state: restarted
          when: restart_services | bool

- name: Rotate Agent Enrollment Password
  hosts: wazuh_managers
  become: true
  serial: 1
  vars:
    rotate_authd: false
  tasks:
    - name: Rotate authd password
      when: rotate_authd | bool
      block:
        - name: Update authd password file
          ansible.builtin.copy:
            content: "{{ hostvars['localhost']['new_authd_password'] }}"
            dest: /var/ossec/etc/authd.pass
            owner: root
            group: wazuh
            mode: '0640'
          no_log: true

        - name: Restart authd
          ansible.builtin.command:
            cmd: /var/ossec/bin/wazuh-control restart
          changed_when: true

- name: Update Ansible Vault
  hosts: localhost
  gather_facts: false
  vars:
    rotate_api: true
    rotate_indexer: true
    rotate_authd: false
    vault_file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
    vault_password_file: "{{ playbook_dir }}/../.vault_password"
    vault_tmp: "{{ playbook_dir }}/../group_vars/all/.vault_tmp_{{ rotation_timestamp }}"
  tasks:
    - name: Verify vault password file exists
      ansible.builtin.stat:
        path: "{{ vault_password_file }}"
      register: vault_pw_stat

    - name: Abort if vault password file missing
      ansible.builtin.fail:
        msg: "Vault password file not found at {{ vault_password_file }}. Cannot update vault without it."
      when: not vault_pw_stat.stat.exists

    - name: Decrypt vault to secure temp location
      ansible.builtin.command:
        cmd: >
          ansible-vault decrypt
          --vault-password-file "{{ vault_password_file }}"
          --output "{{ vault_tmp }}"
          "{{ vault_file }}"
      no_log: true
      changed_when: true

    - name: Secure temp file permissions
      ansible.builtin.file:
        path: "{{ vault_tmp }}"
        mode: '0600'

    - name: Update indexer admin password in vault
      ansible.builtin.lineinfile:
        path: "{{ vault_tmp }}"
        regexp: '^vault_wazuh_indexer_admin_password:'
        line: 'vault_wazuh_indexer_admin_password: "{{ new_indexer_password }}"'
      no_log: true
      when: rotate_indexer | bool

    - name: Update API password in vault
      ansible.builtin.lineinfile:
        path: "{{ vault_tmp }}"
        regexp: '^vault_wazuh_api_password:'
        line: 'vault_wazuh_api_password: "{{ new_api_password }}"'
      no_log: true
      when: rotate_api | bool

    - name: Update agent enrollment password in vault
      ansible.builtin.lineinfile:
        path: "{{ vault_tmp }}"
        regexp: '^vault_wazuh_agent_enrollment_password:'
        line: 'vault_wazuh_agent_enrollment_password: "{{ new_authd_password }}"'
      no_log: true
      when: rotate_authd | bool

    - name: Re-encrypt updated vault
      ansible.builtin.command:
        cmd: >
          ansible-vault encrypt
          --vault-password-file "{{ vault_password_file }}"
          "{{ vault_tmp }}"
      changed_when: true
      no_log: true

    - name: Replace vault file with updated version
      ansible.builtin.command:
        cmd: mv "{{ vault_tmp }}" "{{ vault_file }}"
      changed_when: true

    - name: Ensure plaintext temp file is removed on any failure
      ansible.builtin.shell: |
        shred -u "{{ vault_tmp }}" 2>/dev/null || rm -f "{{ vault_tmp }}"
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Credentials rotated and stored in Ansible Vault
      ansible.builtin.debug:
        msg: "Credentials rotated and stored in Ansible Vault. View with: ./scripts/manage-vault.sh view"

- name: Rotation Summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display rotation summary
      ansible.builtin.debug:
        msg: |

          ═══════════════════════════════════════════════════════════
          CREDENTIAL ROTATION COMPLETE
          ═══════════════════════════════════════════════════════════

          Rotation ID: {{ rotation_timestamp }}

          Updated Credentials:
          {% if rotate_api | bool %}
            ✓ Wazuh API password
          {% endif %}
          {% if rotate_indexer | bool %}
            ✓ Indexer admin password
            ✓ Dashboard configuration
            ✓ Filebeat configuration
          {% endif %}
          {% if rotate_authd | bool %}
            ✓ Agent enrollment password
          {% endif %}

          Files Updated:
            - group_vars/all/vault.yml (encrypted)

          Vault Backup:
            - backups/vault-{{ rotation_timestamp }}/

          ⚠ IMPORTANT:
            - View new credentials: ./scripts/manage-vault.sh view
            - No plaintext credential files are created
            - Update any external integrations manually
            - Test all connections before production use

          ═══════════════════════════════════════════════════════════
