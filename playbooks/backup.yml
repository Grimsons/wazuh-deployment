---
# Wazuh Backup Playbook
# Creates backups of all Wazuh components
#
# Usage: ansible-playbook playbooks/backup.yml -i inventory/hosts.yml
#
# Optional variables:
#   -e "backup_dest=/path/to/backups"  - Custom backup destination
#   -e "backup_indexer=false"          - Skip indexer backup
#   -e "backup_manager=false"          - Skip manager backup
#   -e "backup_dashboard=false"        - Skip dashboard backup

- name: Preflight — warn if snapshot destination may be unencrypted
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Warn about filesystem backup encryption
      ansible.builtin.debug:
        msg: >-
          SECURITY NOTICE: Backups written to a local filesystem path are stored in
          plaintext unless the destination is on an encrypted volume (LUKS, dm-crypt,
          encrypted S3/GCS with SSE, etc.). Ensure your backup_dest is encrypted at
          rest before storing in production. Set wazuh_backup_encryption_confirmed: true
          to suppress this warning.
      when: not (wazuh_backup_encryption_confirmed | default(false) | bool)

- name: Create backup timestamp
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Set backup timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ backup_timestamp | default(ansible_date_time.iso8601_basic_short) }}"
      run_once: true

    - name: Set backup destination
      ansible.builtin.set_fact:
        backup_base_path: "{{ backup_dest | default(playbook_dir + '/../backups') }}"
      run_once: true

    - name: Create backup directory on controller
      ansible.builtin.file:
        path: "{{ backup_base_path }}/{{ backup_timestamp }}"
        state: directory
        mode: '0700'

    - name: Save backup metadata
      ansible.builtin.copy:
        content: |
          timestamp: {{ backup_timestamp }}
          created: {{ ansible_date_time.iso8601 }}
          type: {{ backup_type | default('manual') }}
          indexer: {{ backup_indexer | default(true) }}
          manager: {{ backup_manager | default(true) }}
          dashboard: {{ backup_dashboard | default(true) }}
        dest: "{{ backup_base_path }}/{{ backup_timestamp }}/metadata.yml"
        mode: '0600'

- name: Backup Wazuh Indexer
  hosts: wazuh_indexers
  become: true
  vars:
    backup_timestamp: "{{ hostvars['localhost']['backup_timestamp'] }}"
    backup_base_path: "{{ hostvars['localhost']['backup_base_path'] }}"
  tasks:
    - name: Backup indexer configuration
      when: backup_indexer | default(true) | bool
      block:
        - name: Create local backup directory for indexer
          ansible.builtin.file:
            path: "{{ backup_base_path }}/{{ backup_timestamp }}/indexer/{{ inventory_hostname }}"
            state: directory
            mode: '0700'
          delegate_to: localhost
          become: false

        - name: Create temporary backup directory on indexer
          ansible.builtin.file:
            path: /tmp/wazuh-backup-{{ backup_timestamp }}
            state: directory
            mode: '0700'

        - name: Backup indexer configuration files
          community.general.archive:
            path:
              - /etc/wazuh-indexer/opensearch.yml
              - /etc/wazuh-indexer/opensearch-security/
              - /etc/wazuh-indexer/jvm.options
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/indexer-config.tar.gz
            format: gz
            mode: '0600'

        - name: Backup indexer certificates
          community.general.archive:
            path: /etc/wazuh-indexer/certs/
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/indexer-certs.tar.gz
            format: gz
            mode: '0600'

        - name: Fetch indexer backups to controller
          ansible.builtin.fetch:
            src: "/tmp/wazuh-backup-{{ backup_timestamp }}/{{ item }}"
            dest: "{{ backup_base_path }}/{{ backup_timestamp }}/indexer/{{ inventory_hostname }}/"
            flat: true
          loop:
            - indexer-config.tar.gz
            - indexer-certs.tar.gz

        - name: Check if indexer cert archive is already vault-encrypted
          ansible.builtin.command:
            cmd: >
              head -c 14
              {{ backup_base_path | quote }}/{{ backup_timestamp | quote }}/indexer/{{ inventory_hostname | quote }}/indexer-certs.tar.gz
          delegate_to: localhost
          become: false
          register: indexer_cert_header
          changed_when: false

        - name: Encrypt fetched indexer cert archive on controller
          ansible.builtin.command:
            cmd: >
              ansible-vault encrypt
              {{ backup_base_path | quote }}/{{ backup_timestamp | quote }}/indexer/{{ inventory_hostname | quote }}/indexer-certs.tar.gz
          environment:
            ANSIBLE_VAULT_PASSWORD_FILE: "{{ lookup('env', 'HOME') }}/.config/wazuh-deployment/.vault_password"
          delegate_to: localhost
          become: false
          changed_when: true
          when: "'$ANSIBLE_VAULT' not in (indexer_cert_header.stdout | default(''))"

        - name: Cleanup temporary backup directory
          ansible.builtin.file:
            path: /tmp/wazuh-backup-{{ backup_timestamp }}
            state: absent
      rescue:
        - name: Remove unencrypted backups on failure
          ansible.builtin.file:
            path: "{{ backup_base_path }}/{{ backup_timestamp }}/indexer/{{ inventory_hostname }}"
            state: absent
          delegate_to: localhost
          become: false

        - name: Fail with backup error message
          ansible.builtin.fail:
            msg: "Indexer backup failed. Unencrypted data removed from {{ backup_base_path }}/{{ backup_timestamp }}/indexer/{{ inventory_hostname }}."

        - name: Create indexer snapshot (optional - for data backup)
          ansible.builtin.uri:
            url: "https://127.0.0.1:{{ wazuh_indexer_http_port | default(9200) }}/_snapshot/wazuh_backup"
            method: PUT
            user: "{{ wazuh_indexer_admin_user }}"
            password: "{{ wazuh_indexer_admin_password }}"
            body_format: json
            body:
              type: fs
              settings:
                location: "/var/lib/wazuh-indexer/snapshots"
            validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
            status_code:
              - 200
              - 400  # Repository already exists
          when: backup_indexer_data | default(false) | bool
          run_once: true
          no_log: true

- name: Backup Wazuh Manager
  hosts: wazuh_managers
  become: true
  vars:
    backup_timestamp: "{{ hostvars['localhost']['backup_timestamp'] }}"
    backup_base_path: "{{ hostvars['localhost']['backup_base_path'] }}"
  tasks:
    - name: Backup manager configuration
      when: backup_manager | default(true) | bool
      block:
        - name: Create local backup directory for manager
          ansible.builtin.file:
            path: "{{ backup_base_path }}/{{ backup_timestamp }}/manager/{{ inventory_hostname }}"
            state: directory
            mode: '0700'
          delegate_to: localhost
          become: false

        - name: Create temporary backup directory on manager
          ansible.builtin.file:
            path: /tmp/wazuh-backup-{{ backup_timestamp }}
            state: directory
            mode: '0700'

        - name: Backup manager configuration
          community.general.archive:
            path:
              - /var/ossec/etc/ossec.conf
              - /var/ossec/etc/rules/
              - /var/ossec/etc/decoders/
              - /var/ossec/etc/lists/
              - /var/ossec/etc/shared/
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/manager-config.tar.gz
            format: gz
            mode: '0600'

        - name: Backup manager API configuration
          community.general.archive:
            path:
              - /var/ossec/api/configuration/
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/manager-api.tar.gz
            format: gz
            mode: '0600'

        - name: Backup manager certificates
          community.general.archive:
            path: /var/ossec/etc/certs/
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/manager-certs.tar.gz
            format: gz
            mode: '0600'
          failed_when: false

        - name: Backup agent keys
          ansible.builtin.copy:
            src: /var/ossec/etc/client.keys
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/client.keys
            remote_src: true
            mode: '0600'
          failed_when: false

        - name: Backup RBAC database
          ansible.builtin.copy:
            src: /var/ossec/api/configuration/security/rbac.db
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/rbac.db
            remote_src: true
            mode: '0600'
          failed_when: false

        - name: Fetch manager backups to controller
          ansible.builtin.fetch:
            src: "/tmp/wazuh-backup-{{ backup_timestamp }}/{{ item }}"
            dest: "{{ backup_base_path }}/{{ backup_timestamp }}/manager/{{ inventory_hostname }}/"
            flat: true
          loop:
            - manager-config.tar.gz
            - manager-api.tar.gz
            - manager-certs.tar.gz
            - client.keys
            - rbac.db
          failed_when: false

        - name: Check if manager cert archive is already vault-encrypted
          ansible.builtin.command:
            cmd: >
              head -c 14
              {{ backup_base_path | quote }}/{{ backup_timestamp | quote }}/manager/{{ inventory_hostname | quote }}/manager-certs.tar.gz
          delegate_to: localhost
          become: false
          register: manager_cert_header
          changed_when: false
          when: >
            (backup_base_path + '/' + backup_timestamp + '/manager/' + inventory_hostname + '/manager-certs.tar.gz') is file

        - name: Encrypt fetched manager cert archive on controller
          ansible.builtin.command:
            cmd: >
              ansible-vault encrypt
              {{ backup_base_path | quote }}/{{ backup_timestamp | quote }}/manager/{{ inventory_hostname | quote }}/manager-certs.tar.gz
          environment:
            ANSIBLE_VAULT_PASSWORD_FILE: "{{ lookup('env', 'HOME') }}/.config/wazuh-deployment/.vault_password"
          delegate_to: localhost
          become: false
          changed_when: true
          when: >
            (backup_base_path + '/' + backup_timestamp + '/manager/' + inventory_hostname + '/manager-certs.tar.gz') is file and
            '$ANSIBLE_VAULT' not in (manager_cert_header.stdout | default(''))

        - name: Cleanup temporary backup directory
          ansible.builtin.file:
            path: /tmp/wazuh-backup-{{ backup_timestamp }}
            state: absent
      rescue:
        - name: Remove unencrypted backups on failure
          ansible.builtin.file:
            path: "{{ backup_base_path }}/{{ backup_timestamp }}/manager/{{ inventory_hostname }}"
            state: absent
          delegate_to: localhost
          become: false

        - name: Fail with backup error message
          ansible.builtin.fail:
            msg: "Manager backup failed. Unencrypted data removed from {{ backup_base_path }}/{{ backup_timestamp }}/manager/{{ inventory_hostname }}."

- name: Backup Wazuh Dashboard
  hosts: wazuh_dashboards
  become: true
  vars:
    backup_timestamp: "{{ hostvars['localhost']['backup_timestamp'] }}"
    backup_base_path: "{{ hostvars['localhost']['backup_base_path'] }}"
  tasks:
    - name: Backup dashboard configuration
      when: backup_dashboard | default(true) | bool
      block:
        - name: Create local backup directory for dashboard
          ansible.builtin.file:
            path: "{{ backup_base_path }}/{{ backup_timestamp }}/dashboard/{{ inventory_hostname }}"
            state: directory
            mode: '0700'
          delegate_to: localhost
          become: false

        - name: Create temporary backup directory on dashboard
          ansible.builtin.file:
            path: /tmp/wazuh-backup-{{ backup_timestamp }}
            state: directory
            mode: '0700'

        - name: Backup dashboard configuration
          community.general.archive:
            path:
              - /etc/wazuh-dashboard/opensearch_dashboards.yml
              - /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/dashboard-config.tar.gz
            format: gz
            mode: '0600'

        - name: Backup dashboard certificates
          community.general.archive:
            path: /etc/wazuh-dashboard/certs/
            dest: /tmp/wazuh-backup-{{ backup_timestamp }}/dashboard-certs.tar.gz
            format: gz
            mode: '0600'

        - name: Fetch dashboard backups to controller
          ansible.builtin.fetch:
            src: "/tmp/wazuh-backup-{{ backup_timestamp }}/{{ item }}"
            dest: "{{ backup_base_path }}/{{ backup_timestamp }}/dashboard/{{ inventory_hostname }}/"
            flat: true
          loop:
            - dashboard-config.tar.gz
            - dashboard-certs.tar.gz

        - name: Check if dashboard cert archive is already vault-encrypted
          ansible.builtin.command:
            cmd: >
              head -c 14
              {{ backup_base_path | quote }}/{{ backup_timestamp | quote }}/dashboard/{{ inventory_hostname | quote }}/dashboard-certs.tar.gz
          delegate_to: localhost
          become: false
          register: dashboard_cert_header
          changed_when: false
          when: >
            (backup_base_path + '/' + backup_timestamp + '/dashboard/' + inventory_hostname + '/dashboard-certs.tar.gz') is file

        - name: Encrypt fetched dashboard cert archive on controller
          ansible.builtin.command:
            cmd: >
              ansible-vault encrypt
              {{ backup_base_path | quote }}/{{ backup_timestamp | quote }}/dashboard/{{ inventory_hostname | quote }}/dashboard-certs.tar.gz
          environment:
            ANSIBLE_VAULT_PASSWORD_FILE: "{{ lookup('env', 'HOME') }}/.config/wazuh-deployment/.vault_password"
          delegate_to: localhost
          become: false
          changed_when: true
          when: >
            (backup_base_path + '/' + backup_timestamp + '/dashboard/' + inventory_hostname + '/dashboard-certs.tar.gz') is file and
            '$ANSIBLE_VAULT' not in (dashboard_cert_header.stdout | default(''))

        - name: Cleanup temporary backup directory
          ansible.builtin.file:
            path: /tmp/wazuh-backup-{{ backup_timestamp }}
            state: absent
      rescue:
        - name: Remove unencrypted backups on failure
          ansible.builtin.file:
            path: "{{ backup_base_path }}/{{ backup_timestamp }}/dashboard/{{ inventory_hostname }}"
            state: absent
          delegate_to: localhost
          become: false

        - name: Fail with backup error message
          ansible.builtin.fail:
            msg: "Dashboard backup failed. Unencrypted data removed from {{ backup_base_path }}/{{ backup_timestamp }}/dashboard/{{ inventory_hostname }}."

- name: Backup summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display backup location
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════
          BACKUP COMPLETE
          ═══════════════════════════════════════════════════════════════
          Backup Location: {{ backup_base_path }}/{{ backup_timestamp }}

          Contents:
            - indexer/   - Indexer configuration and certificates
            - manager/   - Manager configuration, rules, decoders, and agent keys
            - dashboard/ - Dashboard configuration and certificates

          To restore, use: ansible-playbook playbooks/restore.yml -e "restore_from={{ backup_timestamp }}"
          ═══════════════════════════════════════════════════════════════
