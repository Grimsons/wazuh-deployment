---
# Wazuh Indexer Role - Default Variables

wazuh_direct_download: "{{ wazuh_is_prerelease | default(false) | bool }}"
wazuh_indexer_package_download_path: "/tmp/wazuh-indexer"

# Package settings
wazuh_indexer_package_name: "wazuh-indexer"
wazuh_indexer_service_name: "wazuh-indexer"

# Repository settings (version-aware)
# Production releases (e.g. 4.14.5) use packages.wazuh.com
# Pre-release versions (e.g. 5.0.0-beta2) use packages-staging.xdrsiem.wazuh.info
wazuh_repo_gpg_key: >-
  {{ 'https://packages-staging.xdrsiem.wazuh.info/key/GPG-KEY-WAZUH'
     if (wazuh_version is search('-'))
     else 'https://packages.wazuh.com/key/GPG-KEY-WAZUH' }}
wazuh_repo_url_apt: >-
  {{ 'https://packages-staging.xdrsiem.wazuh.info/pre-release/' + (wazuh_version.split('.')[0] + '.x') + '/apt/'
     if (wazuh_version is search('-'))
     else 'https://packages.wazuh.com/' + (wazuh_version.split('.')[0] + '.x') + '/apt/' }}
wazuh_repo_url_yum: >-
  {{ 'https://packages-staging.xdrsiem.wazuh.info/pre-release/' + (wazuh_version.split('.')[0] + '.x') + '/yum/'
     if (wazuh_version is search('-'))
     else 'https://packages.wazuh.com/' + (wazuh_version.split('.')[0] + '.x') + '/yum/' }}

# Indexer configuration
wazuh_indexer_config_path: /etc/wazuh-indexer
wazuh_indexer_data_path: /var/lib/wazuh-indexer
wazuh_indexer_log_path: /var/log/wazuh-indexer

# Network settings
wazuh_indexer_http_port: 9200
wazuh_indexer_transport_port: 9300
# Bind to localhost for single-node. Override to "0.0.0.0" for multi-node clusters.
wazuh_indexer_network_host: "127.0.0.1"

# Dashboard nodes (for firewall rules — override in group_vars for multi-node deployments)
wazuh_dashboard_nodes: []

# Firewall management
wazuh_configure_firewall: false
wazuh_allowed_cluster_networks: []

# Cluster settings
wazuh_indexer_cluster_name: "wazuh-cluster"
wazuh_indexer_cluster_initial_master_nodes: []
# Keep the role renderable for standalone hosts and validation probes. A
# multi-node deployment should override this with the complete cluster list.
wazuh_indexer_nodes:
  - name: indexer-1
    ip: 127.0.0.1

# ═══════════════════════════════════════════════════════════════
# Authentication Settings
# ═══════════════════════════════════════════════════════════════
# Default password used for initial indexer authentication (OpenSearch default)
# This password is automatically changed to a secure random password during deployment
# DO NOT change this unless the Wazuh indexer default changes
wazuh_indexer_default_password: "admin"

# Startup check timeouts (configurable for slow systems or large clusters)
wazuh_indexer_health_check_retries: 30
wazuh_indexer_health_check_delay: 10
wazuh_indexer_startup_timeout: 300

# JVM settings
# Heap size: "auto" calculates 50% of RAM (min 1GB, max 32GB)
# Or specify manually: "1g", "4g", "16g", etc.
# IMPORTANT: Max 32GB - over this, JVM can't use compressed OOPs
wazuh_indexer_heap_size: "auto"
wazuh_indexer_max_map_count: 262144
# Memory lock - prevents JVM from being swapped (CRITICAL for production)
wazuh_indexer_memory_lock: true

# Security settings
wazuh_indexer_admin_user: "admin"
# Admin password is auto-generated if not specified
# wazuh_indexer_admin_password: "your-secure-password"  # Uncomment to set manually

# SSL/TLS settings
wazuh_indexer_ssl_http_enabled: true
wazuh_indexer_ssl_transport_enabled: true

# Performance settings
wazuh_indexer_thread_pool_search_size: 50
wazuh_indexer_thread_pool_write_size: 50

# Index settings
wazuh_indexer_number_of_shards: 3
wazuh_indexer_number_of_replicas: 0

# Paths
wazuh_indexer_certs_path: /etc/wazuh-indexer/certs

# OpenSearch TLS cipher suites — explicit list activates the restriction block in opensearch.yml.j2
# Java JSSE names required (not OpenSSL short names). All suites are ECDHE forward-secret + AEAD.
wazuh_tls_ciphers: >-
  TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,
  TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,
  TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,
  TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,
  TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,
  TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256

# Index retention settings (ISM policy)
wazuh_retention_enabled: true
wazuh_retention_days: 365            # 1 year total retention (adjust based on compliance requirements)
wazuh_retention_warm_after_days: 7   # Move to warm after 7 days
wazuh_retention_cold_after_days: 30  # Move to cold after 30 days

# Alerts index settings
wazuh_indexer_alerts_shards: 1
wazuh_indexer_alerts_replicas: 0

# ═══════════════════════════════════════════════════════════════
# Index Rollover Settings (Automatic Index Management)
# ═══════════════════════════════════════════════════════════════
# Rollover prevents reaching the 1000 open index limit by:
# 1. Creating new indices based on size/age/document count
# 2. Closing cold indices (closed indices don't count toward limit)
# 3. Deleting old indices based on retention policy

# Enable automatic index rollover (recommended for production)
wazuh_rollover_enabled: true

# Rollover triggers (any condition being met triggers rollover)
# Recommended: 30GB per shard for optimal performance
wazuh_rollover_max_size: "30gb"          # Rollover when index reaches this size
wazuh_rollover_max_age: "1d"             # Rollover daily (creates predictable index names)
wazuh_rollover_max_docs: 50000000        # Rollover at 50 million documents

# Minimum rollover conditions (prevents too-frequent rollovers)
wazuh_rollover_min_size: "1gb"           # Don't rollover if smaller than this
wazuh_rollover_min_age: "1h"             # Don't rollover if younger than 1 hour
wazuh_rollover_min_docs: 1               # Minimum docs before rollover (1 = always allow)

# Index closing settings
# When true, cold indices are CLOSED instead of just read-only
# CRITICAL: Closed indices don't count toward the 1000 open index limit!
wazuh_close_cold_indices: true

# Force merge settings (reduces segment count, saves memory)
wazuh_warm_force_merge_segments: 1       # Merge to 1 segment in warm state

# Shard settings per index type
wazuh_alerts_primary_shards: 1           # Primary shards for alerts indices
wazuh_alerts_replica_shards: 0           # Replica shards for alerts indices (set > 0 for HA)
wazuh_archives_primary_shards: 1         # Primary shards for archives indices
wazuh_archives_replica_shards: 0         # Replica shards for archives indices

# Index alias names (write aliases for rollover)
wazuh_alerts_alias: "wazuh-alerts"
wazuh_archives_alias: "wazuh-archives"
wazuh_monitoring_alias: "wazuh-monitoring"
wazuh_statistics_alias: "wazuh-statistics"

# Index retention overrides (specific to monitoring/statistics — overrides wazuh_retention_days)
wazuh_monitoring_retention_days: 7
wazuh_statistics_retention_days: 7

# ═══════════════════════════════════════════════════════════════
# Security-plugin system indices
# ═══════════════════════════════════════════════════════════════
# Which indices must be shielded depends on the plugins the indexer ships,
# and that set differs by major. This list is a static setting: it is read at
# boot, so it cannot be discovered at runtime like a certificate path can.
# Override wazuh_indexer_system_indices if you add a plugin that owns indices.
wazuh_indexer_system_indices: >-
  {{ wazuh_indexer_system_indices_5x
     if (wazuh_is_5x | bool) else wazuh_indexer_system_indices_4x }}

# 4.x ships the OpenSearch 2.x plugin set (alerting, anomaly detection,
# observability, notebooks, reports, asynchronous search).
wazuh_indexer_system_indices_4x:
  - .opendistro-alerting-config
  - .opendistro-alerting-alert*
  - .opendistro-anomaly-results*
  - .opendistro-anomaly-detector*
  - .opendistro-anomaly-checkpoints
  - .opendistro-anomaly-detection-state
  - .opendistro-reports-*
  - .opendistro-notifications-*
  - .opendistro-notebooks
  - .opensearch-observability
  - .opendistro-asynchronous-search-response*
  - .replication-metadata-store

# 5.x ships a different plugin set. The OpenSearch 2.x entries above are
# gone: anomaly detection, asynchronous search, ML Commons, k-NN, SQL and
# neural search are not part of the 5.x indexer distribution, so listing
# their indices protects nothing. The Wazuh content-manager plugins do own
# system indices and must be shielded.
#
# Do not add .wazuh-settings here. It is a normal index whose access is
# granted explicitly by the wazuh_manager and wazuh_admin roles; declaring it
# a system index would override those grants and make it unreadable by the
# very components that are supposed to write it.
wazuh_indexer_system_indices_5x:
  - .wazuh-content-manager-resource-locks
  - .wazuh-cti-consumers
  - .wazuh-content-manager-jobs
  - .wazuh-internal-state

# ═══════════════════════════════════════════════════════════════
# 5.x index families (OpenSearch 3.x, "v5" schemas)
# ═══════════════════════════════════════════════════════════════
# 4.x and 5.x index names are disjoint. 4.x is OpenSearch 2.x and its index
# families (wazuh-alerts-*, wazuh-archives-*, wazuh-monitoring-*,
# wazuh-statistics-*) are gone in 5.x; 5.x ships new schemas whose mappings
# cannot be derived from the 4.x document shape. The four 4.x families map
# onto the four 5.x families below. Do not create 4.x indices on a 5.x
# cluster, and do not expect 5.x indices on a 4.x cluster.
#
# families.<name> is consumed by tasks/index_management_5x.yml, which creates
# one ISM policy, one ISM template and one bootstrap index per family.
wazuh_indexer_5x_families:
  # The alert/event stream. Successor to 4.x wazuh-alerts-* + wazuh-archives-*
  # (4.x archived alert copies have no separate 5.x family).
  events:
    pattern: "wazuh-events-v5*"
    alias: "wazuh-events-v5"
    retention_days: "{{ wazuh_retention_days }}"
    primary_shards: 1
    replica_shards: 0
  # Successor to 4.x wazuh-archives-*: per-agent stateful data.
  states:
    pattern: "wazuh-states-*"
    alias: "wazuh-states"
    retention_days: 30
    primary_shards: 1
    replica_shards: 0
  # Successor to 4.x wazuh-monitoring-*.
  metrics:
    pattern: "wazuh-metrics-*"
    alias: "wazuh-metrics"
    retention_days: "{{ wazuh_monitoring_retention_days }}"
    primary_shards: 1
    replica_shards: 0
  # Successor to 4.x wazuh-statistics-*.
  agent:
    pattern: "wazuh-agent-*"
    alias: "wazuh-agent"
    retention_days: "{{ wazuh_statistics_retention_days }}"
    primary_shards: 1
    replica_shards: 0

# 5.x index templates are composed with, not substituted for, the templates
# the indexer ships for its own schemas. Creating a standalone template with
# one of these patterns would shadow the shipped v5 mappings (only the
# highest-priority matching template is applied), so the role resolves the
# shipped template at runtime and composes on top of it.
# Refuse to proceed rather than shadow a mapping set we have not inspected.
wazuh_indexer_5x_require_shipped_template: true

# ═══════════════════════════════════════════════════════════════
# 5.x security
# ═══════════════════════════════════════════════════════════════
# 5.x ships its own set of internal users and "the bundled password hashes
# decode to the username, and nothing rotates them during installation". That
# leaves every one of them reachable with a guessable password unless this role
# changes them or the operator accepts the risk explicitly.
wazuh_indexer_5x_default_users:
  - admin
  - kibanaserver
  - wazuh-manager
  - wazuh-admin
  - wazuh-demo
  - wazuh-readonly

# Refuse to finish a 5.x deployment while any of the above still accepts its
# own name as its password. Set false to accept the shipped defaults, which is
# only defensible on a cluster that is not reachable from anywhere untrusted.
wazuh_indexer_5x_require_rotated_defaults: true

# Passwords for the users above, from vault. Users absent from this mapping
# are only checked, not changed.
wazuh_indexer_5x_user_passwords: {}

# wazuh-passwords-tool.sh enforces this and exits non-zero, but by then the
# only feedback is a line in /var/log/wazuh-passwords-tool.log. Checked here
# first so the failure names the rule.
#
# Note the symbol set is narrow: a password ending in '!' or '#' is rejected
# even when it satisfies the length and character-class rules, so a 4.x vault
# password cannot be reused unchanged.
wazuh_indexer_5x_password_min_length: 8
wazuh_indexer_5x_password_max_length: 64
wazuh_indexer_5x_password_symbols: ".*+?-"

# The tool authenticates with the admin certificate at a fixed path and offers
# no way to override it, so those two paths are a hard requirement of the 5.x
# password flow rather than a convention.
wazuh_indexer_5x_password_tool_admin_cert: /etc/wazuh-indexer/certs/admin.pem
wazuh_indexer_5x_password_tool_admin_key: /etc/wazuh-indexer/certs/admin-key.pem
wazuh_indexer_5x_password_tool: >-
  /usr/share/wazuh-indexer/plugins/opensearch-security/tools/wazuh-passwords-tool.sh
