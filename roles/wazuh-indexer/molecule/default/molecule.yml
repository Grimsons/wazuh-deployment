---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: wazuh-indexer-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

  - name: wazuh-indexer-rocky9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        wazuh_version: "4.14.5"
        wazuh_indexer_nodes:
          - name: indexer-1
            ip: 127.0.0.1
        wazuh_indexer_admin_password: "TestPass1234@"
        wazuh_ssl_verify_certificates: false
        wazuh_configure_firewall: false
        wazuh_indexer_heap_size: "512m"
        indexer_node_name: "indexer-1"

verifier:
  name: ansible
