---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: indexer-1
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

  - name: manager-1
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd

  - name: dashboard-1
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

  - name: agent-1
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        wazuh_version: "4.14.5"
        wazuh_indexer_nodes:
          - name: indexer-1
            ip: indexer-1
        wazuh_manager_nodes:
          - name: manager-1
            ip: manager-1
        wazuh_dashboard_nodes:
          - ip: dashboard-1
        wazuh_indexer_admin_password: "{{ vault_wazuh_indexer_admin_password }}"
        wazuh_api_password: "{{ vault_wazuh_api_password }}"
        wazuh_agent_enrollment_password: "{{ vault_wazuh_agent_enrollment_password }}"
        wazuh_manager_cluster_key: "{{ vault_wazuh_manager_cluster_key }}"
        wazuh_indexer_heap_size: "512m"
        wazuh_indexer_memory_lock: false
        wazuh_indexer_network_host: "0.0.0.0"
        wazuh_dashboard_host: "0.0.0.0"
        indexer_node_name: "indexer-1"
        dashboard_node_name: "dashboard-1"
        wazuh_ssl_verify_certificates: false
        wazuh_configure_firewall: false
        wazuh_manager_cluster_enabled: false
        wazuh_indexer_startup_timeout: 600

verifier:
  name: ansible
