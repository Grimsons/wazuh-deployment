---
# Wazuh Indexer - index templates, rollover and retention
#
# The two majors are separate implementations rather than one file full of
# conditionals, because they have nothing in common but the shape of the
# lifecycle: 4.x (OpenSearch 2.x) manages wazuh-alerts-*, wazuh-archives-*,
# wazuh-monitoring-* and wazuh-statistics-*, and 5.x (OpenSearch 3.x) manages
# wazuh-events-v5*, wazuh-states-*, wazuh-metrics-* and wazuh-agent-*. The
# document schemas differ too, so the mappings in the 4.x file cannot be
# carried over. index_management_4x.yml is left exactly as it was so that the
# 4.14.5 path does not change as a side effect of the 5.x work.

- name: Configure index management for Wazuh 4.x
  ansible.builtin.include_tasks: index_management_4x.yml
  when: not (wazuh_is_5x | default(false) | bool)

- name: Configure index management for Wazuh 5.x
  ansible.builtin.include_tasks: index_management_5x.yml
  when: wazuh_is_5x | default(false) | bool
