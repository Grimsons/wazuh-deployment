---
# Wazuh Indexer - Security Initialization
#
# 5.x applies its security configuration with indexer-security-init.sh, which
# is the only supported entry point: 5.x renamed whitelist.yml to allowlist.yml
# and the security plugin refuses to start from a configuration tree it does
# not recognise. The 4.x manual securityadmin.sh fallback would have nothing to
# fall back to, so it stays in the 4.x file where it can work.

- name: Initialize security for Wazuh 4.x
  ansible.builtin.include_tasks: security_init_4x.yml
  when: not (wazuh_is_5x | default(false) | bool)

- name: Initialize security for Wazuh 5.x
  ansible.builtin.include_tasks: security_init_5x.yml
  when: wazuh_is_5x | default(false) | bool
