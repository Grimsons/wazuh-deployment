---
# Wazuh Indexer - Security Users Configuration
# Rotates the internal user passwords from Ansible Vault.
#
# The mechanism differs per major: 4.x hashes the password and rewrites
# internal_users.yml directly, 5.x uses the wazuh-passwords-tool.sh the package
# ships so that the running security index and the file on disk cannot drift
# apart. See the respective files for why.

- name: Configure security users for Wazuh 4.x
  ansible.builtin.include_tasks: security_users_4x.yml
  when: not (wazuh_is_5x | default(false) | bool)

- name: Configure security users for Wazuh 5.x
  ansible.builtin.include_tasks: security_users_5x.yml
  when: wazuh_is_5x | default(false) | bool
