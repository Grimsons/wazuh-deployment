---
# Wazuh Indexer - Security Users Configuration
# This configures the admin user with a secure random password
# All passwords are managed through Ansible Vault

- name: Assert indexer admin password is set in vault
  ansible.builtin.assert:
    that:
      - wazuh_indexer_admin_password is defined
      - wazuh_indexer_admin_password | length >= 16
      - wazuh_indexer_admin_password != 'admin'
    fail_msg: >
      Set wazuh_indexer_admin_password in group_vars/all/vault.yml before deployment.
      Run: make vault-edit  (minimum 16 chars, not 'admin')
  run_once: true

- name: Set admin password from vault
  ansible.builtin.set_fact:
    wazuh_admin_password: "{{ wazuh_indexer_admin_password }}"
  run_once: true
  no_log: true

- name: Hash the admin password using OpenSearch security tools
  ansible.builtin.shell: |
    set -euo pipefail
    export JAVA_HOME=/usr/share/wazuh-indexer/jdk
    _tmp=$(mktemp /dev/shm/.hash_XXXXXX 2>/dev/null || mktemp)
    chmod 600 "$_tmp"
    printf '%s' {{ wazuh_admin_password | quote }} > "$_tmp"
    # hash.sh only accepts -p; temp file limits window vs inline expansion
    _hash=$(/usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p "$(cat "$_tmp")")
    shred -u "$_tmp" 2>/dev/null || rm -f "$_tmp"
    echo "$_hash"
  become: true
  register: password_hash
  changed_when: false
  no_log: true

- name: Extract hashed password
  ansible.builtin.set_fact:
    admin_password_hash: "{{ password_hash.stdout_lines | last }}"
  no_log: true

- name: Backup original internal_users.yml
  ansible.builtin.copy:
    src: /etc/wazuh-indexer/opensearch-security/internal_users.yml
    dest: /etc/wazuh-indexer/opensearch-security/internal_users.yml.bak
    remote_src: true
    mode: '0600'
  become: true

- name: Update admin user password in internal_users.yml
  ansible.builtin.replace:
    path: /etc/wazuh-indexer/opensearch-security/internal_users.yml
    regexp: '^(admin:\s*\n\s*hash:\s*)"[^"]*"'
    replace: '\1"{{ admin_password_hash }}"'
  become: true
  no_log: true
  diff: false

- name: Apply security configuration with new password
  ansible.builtin.shell: |
    export JAVA_HOME=/usr/share/wazuh-indexer/jdk
    /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh \
      -cd /etc/wazuh-indexer/opensearch-security \
      -cacert {{ wazuh_indexer_certs_path | quote }}/root-ca.pem \
      -cert {{ wazuh_indexer_certs_path | quote }}/admin.pem \
      -key {{ wazuh_indexer_certs_path | quote }}/admin-key.pem \
      -h 127.0.0.1 \
      -p {{ wazuh_indexer_http_port | quote }} \
      -icl
  become: true
  register: security_update
  changed_when: security_update.rc == 0
  run_once: true
  no_log: true

- name: Display security update result
  ansible.builtin.debug:
    msg: "Security configuration updated successfully with new admin password"
  when: security_update.rc == 0
  run_once: true
