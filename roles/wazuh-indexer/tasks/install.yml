---
# Wazuh Indexer - Installation

- name: Load the artifact manifest for Wazuh 5.x
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/vars/{{ urls_file }}"
  when: wazuh_is_5x | default(false) | bool

- name: Install Wazuh Indexer from the 5.x artifact manifest
  ansible.builtin.include_tasks: ../../package-urls/tasks/direct-install.yml
  vars:
    wazuh_package_component: wazuh-indexer
    wazuh_package_notify_handler: restart wazuh-indexer
  when: (wazuh_package_install_mode | default('repository')) == 'direct-download'

- name: Download and install Wazuh Indexer via .deb (pre-release)
  when:
    - ansible_os_family == 'Debian'
    - wazuh_direct_download | default(false)
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  become: true
  block:
    - name: Create temp directory for packages
      ansible.builtin.file:
        path: "{{ wazuh_indexer_package_download_path }}"
        state: directory
        mode: '0755'

    - name: Download Wazuh Indexer .deb package
      ansible.builtin.get_url:
        url: "{{ wazuh_indexer_amd64_deb }}"
        dest: "{{ wazuh_indexer_package_download_path }}/wazuh-indexer.deb"
        checksum: "{{ wazuh_indexer_amd64_deb_sha256 | default(omit) }}"

    - name: Install .deb package
      ansible.builtin.apt:
        deb: "{{ wazuh_indexer_package_download_path }}/wazuh-indexer.deb"
      notify: restart wazuh-indexer

- name: Install Wazuh Indexer via apt repository (production)
  ansible.builtin.apt:
    name: "wazuh-indexer={{ wazuh_version }}-*"
    state: present
    update_cache: true
  become: true
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  notify: restart wazuh-indexer

- name: Download and install Wazuh Indexer via .rpm (pre-release)
  when:
    - ansible_os_family == 'RedHat'
    - wazuh_direct_download | default(false)
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  become: true
  block:
    - name: Create temp directory for packages
      ansible.builtin.file:
        path: "{{ wazuh_indexer_package_download_path }}"
        state: directory
        mode: '0755'

    - name: Download Wazuh Indexer .rpm package
      ansible.builtin.get_url:
        url: "{{ wazuh_indexer_x86_64_rpm }}"
        dest: "{{ wazuh_indexer_package_download_path }}/wazuh-indexer.rpm"
        checksum: "{{ wazuh_indexer_x86_64_rpm_sha256 | default(omit) }}"

    - name: Install .rpm package
      ansible.builtin.dnf:
        name: "{{ wazuh_indexer_package_download_path }}/wazuh-indexer.rpm"
        state: present
        disable_gpg_check: true
      notify: restart wazuh-indexer

- name: Install Wazuh Indexer via dnf repository (production)
  ansible.builtin.dnf:
    name: "wazuh-indexer-{{ wazuh_version }}"
    state: present
  become: true
  when:
    - ansible_os_family == 'RedHat'
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  notify: restart wazuh-indexer

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
