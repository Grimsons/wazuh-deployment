---
# Wazuh Monitoring Role - Handlers

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart opensearch exporter
  ansible.builtin.systemd:
    name: wazuh-opensearch-exporter
    state: restarted
  become: true

- name: Restart wazuh manager exporter
  ansible.builtin.systemd:
    name: wazuh-manager-exporter
    state: restarted
  become: true

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  become: true
  when: wazuh_monitoring_grafana_enabled | default(true) | bool
