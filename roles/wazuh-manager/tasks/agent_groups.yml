---
# Wazuh Manager - Agent Groups Configuration
# Creates and configures agent groups with custom configuration
# API credentials are sourced from Ansible Vault via group_vars

# Get API token for authentication
- name: Authenticate to Wazuh API
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ wazuh_manager_api_port | default(55000) }}/security/user/authenticate"
    method: POST
    user: "{{ wazuh_api_user | default('wazuh') }}"
    password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
    return_content: true
  register: api_auth
  until: api_auth.status | default(0) == 200
  retries: 6
  delay: 10
  no_log: true
  run_once: true

- name: Set API token
  ansible.builtin.set_fact:
    wazuh_api_token: "{{ api_auth.json.data.token }}"
  no_log: true
  run_once: true

# Create agent groups
- name: Create agent groups
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ wazuh_manager_api_port | default(55000) }}/groups"
    method: POST
    headers:
      Authorization: "Bearer {{ wazuh_api_token }}"
    body_format: json
    body:
      group_id: "{{ item.name }}"
    validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
    status_code:
      - 200
      - 400  # Group already exists
  loop: "{{ wazuh_agent_groups }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true

# Ensure group directories exist before deploying files
- name: Ensure group directories exist
  ansible.builtin.file:
    path: "{{ wazuh_manager_install_path }}/etc/shared/{{ item.name }}"
    state: directory
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    mode: '0770'
  loop: "{{ wazuh_agent_groups }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

# Deploy group-specific agent.conf
- name: Create agent.conf for groups
  ansible.builtin.template:
    src: agent_group_conf.j2
    dest: "{{ wazuh_manager_install_path }}/etc/shared/{{ item.name }}/agent.conf"
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    mode: '0640'
  loop: "{{ wazuh_agent_groups }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: item.config is defined
  notify: restart wazuh-manager

# Deploy custom files to group directories
- name: Deploy custom files to agent groups
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/agent_groups/{{ item.0.name }}/{{ item.1 }}"
    dest: "{{ wazuh_manager_install_path }}/etc/shared/{{ item.0.name }}/{{ item.1 }}"
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    mode: '0640'
  loop: "{{ wazuh_agent_groups | subelements('files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  become: true
  when: item.0.files is defined
  ignore_errors: true

- name: Display agent groups summary
  ansible.builtin.debug:
    msg: |
      Agent groups configured:
      {% for group in wazuh_agent_groups %}
        - {{ group.name }}: {{ group.description | default('No description') }}
      {% endfor %}
  run_once: true

# ═══════════════════════════════════════════════════════════════
# Auto Agent Group Assignment
# Assigns connected agents to groups based on OS platform
# ═══════════════════════════════════════════════════════════════
- name: Auto-assign agents to OS-based groups
  when: wazuh_auto_group_assignment_enabled | default(false)
  run_once: true
  block:
    - name: Get all registered agents
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ wazuh_manager_api_port | default(55000) }}/agents?limit=500&status=active,disconnected"
        method: GET
        headers:
          Authorization: "Bearer {{ wazuh_api_token }}"
        validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
        return_content: true
      register: all_agents
      no_log: true

    - name: Build agent platform list
      ansible.builtin.set_fact:
        agents_by_platform: >-
          {{ all_agents.json.data.affected_items | default([])
             | selectattr('id', 'ne', '000')
             | list }}

    - name: Assign agents to groups based on OS platform
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ wazuh_manager_api_port | default(55000) }}/agents/{{ item.id }}/group/{{ target_group }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ wazuh_api_token }}"
        validate_certs: "{{ wazuh_ssl_verify_certificates | default(true) }}"
        status_code: [200, 400]
      vars:
        agent_platform: "{{ item.os.platform | default('linux') | lower }}"
        target_group: "{{ wazuh_auto_group_assignment_rules[agent_platform] | default(wazuh_auto_group_assignment_rules['linux']) }}"
      loop: "{{ agents_by_platform }}"
      loop_control:
        label: "{{ item.name | default(item.id) }} ({{ item.os.platform | default('unknown') }}) → {{ target_group }}"
      when:
        - item.os is defined
        - item.os.platform | lower in wazuh_auto_group_assignment_rules
      no_log: true
      ignore_errors: true
