---
# Wazuh Manager - Keystore configuration
# Store indexer credentials in the wazuh-keystore for the indexer connector
# Required for state inventory / IT Hygiene data to flow to the indexer

- name: Check if keystore username is present
  ansible.builtin.command: >-
    {{ wazuh_manager_install_path }}/bin/{{ wazuh_manager_binary_prefix }}keystore -f indexer -k username
  become: true
  register: keystore_username_check
  changed_when: false
  failed_when: false
  no_log: true
  when: wazuh_indexer_connection_enabled | default(true)

- name: Configure Wazuh keystore for indexer username
  ansible.builtin.shell: |
    set -o pipefail
    HASH_FILE={{ wazuh_manager_install_path }}/etc/.keystore_username_hash
    NEW_HASH=$(printf '%s' {{ wazuh_indexer_admin_user | default("admin") | quote }} | sha256sum | cut -d' ' -f1)
    OLD_HASH=$(cat "$HASH_FILE" 2>/dev/null || echo "")
    if [ "$NEW_HASH" != "$OLD_HASH" ] || [ "{{ keystore_username_check.rc | default(1) }}" != "0" ]; then
      printf '%s' {{ wazuh_indexer_admin_user | default("admin") | quote }} | {{ wazuh_manager_install_path }}/bin/{{ wazuh_manager_binary_prefix }}keystore -f indexer -k username
      echo "$NEW_HASH" > "$HASH_FILE"
      chmod 600 "$HASH_FILE"
      chown {{ wazuh_manager_owner }}:{{ wazuh_manager_group }} "$HASH_FILE"
      echo "changed"
    else
      echo "ok"
    fi
  args:
    executable: /bin/bash
  become: true
  register: keystore_username_result
  changed_when: "'changed' in keystore_username_result.stdout"
  no_log: true
  when: wazuh_indexer_connection_enabled | default(true)

- name: Check if keystore password is present
  ansible.builtin.command: >-
    {{ wazuh_manager_install_path }}/bin/{{ wazuh_manager_binary_prefix }}keystore -f indexer -k password
  become: true
  register: keystore_password_check
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - wazuh_indexer_connection_enabled | default(true)
    - wazuh_indexer_admin_password is defined

- name: Configure Wazuh keystore for indexer password
  ansible.builtin.shell: |
    set -o pipefail
    HASH_FILE={{ wazuh_manager_install_path }}/etc/.keystore_password_hash
    NEW_HASH=$(printf '%s' {{ wazuh_indexer_admin_password | quote }} | sha256sum | cut -d' ' -f1)
    OLD_HASH=$(cat "$HASH_FILE" 2>/dev/null || echo "")
    if [ "$NEW_HASH" != "$OLD_HASH" ] || [ "{{ keystore_password_check.rc | default(1) }}" != "0" ]; then
      printf '%s' {{ wazuh_indexer_admin_password | quote }} | {{ wazuh_manager_install_path }}/bin/{{ wazuh_manager_binary_prefix }}keystore -f indexer -k password
      echo "$NEW_HASH" > "$HASH_FILE"
      chmod 600 "$HASH_FILE"
      chown {{ wazuh_manager_owner }}:{{ wazuh_manager_group }} "$HASH_FILE"
      echo "changed"
    else
      echo "ok"
    fi
  args:
    executable: /bin/bash
  become: true
  register: keystore_password_result
  changed_when: "'changed' in keystore_password_result.stdout"
  no_log: true
  when:
    - wazuh_indexer_connection_enabled | default(true)
    - wazuh_indexer_admin_password is defined

- name: Notify if keystore was updated
  ansible.builtin.debug:
    msg: "Wazuh keystore updated with indexer credentials"
  when: keystore_username_result.changed or keystore_password_result.changed

- name: Restart wazuh-manager if keystore was updated
  ansible.builtin.systemd:
    name: "{{ wazuh_manager_service_name }}"
    state: restarted
  become: true
  when: keystore_username_result.changed or keystore_password_result.changed
