---
# Wazuh Manager - Configuration

- name: Deploy manager config from template
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: "{{ wazuh_manager_config_file }}"
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    mode: '0640'
    backup: true
  become: true
  register: manager_config_deployed
  notify: restart wazuh-manager

- name: Deploy local_internal_options.conf for performance tuning
  ansible.builtin.template:
    src: local_internal_options.conf.j2
    dest: "{{ wazuh_manager_install_path }}/etc/local_internal_options.conf"
    owner: root
    group: "{{ wazuh_manager_group }}"
    mode: '0640'
  become: true
  when: wazuh_internal_options_enabled | default(true)
  notify: restart wazuh-manager
  changed_when: false

- name: Validate manager configuration before restart
  block:
    - name: Run Wazuh configuration test
      ansible.builtin.command: "{{ wazuh_manager_install_path }}/bin/{{ wazuh_manager_binary_prefix }}analysisd -t"
      become: true
      register: config_validation
      changed_when: false

    - name: Configuration validation passed
      ansible.builtin.debug:
        msg: "Manager configuration validation: PASSED"
      when: config_validation.rc == 0
  rescue:
    - name: Configuration validation failed
      ansible.builtin.debug:
        msg: |
          WARNING: Manager configuration validation FAILED.
          Error output: {{ config_validation.stderr | default('Unknown error') }}
          A backup of the previous config has been preserved by Ansible.
          Please review the configuration and fix any errors.

    - name: Abort due to invalid configuration
      ansible.builtin.fail:
        msg: "Aborting: Wazuh manager configuration is invalid. Fix the errors shown above."
  when: manager_config_deployed.changed

- name: Configure local rules directory
  ansible.builtin.file:
    path: "{{ wazuh_manager_install_path }}/etc/rules"
    state: directory
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    mode: '0750'
  become: true

- name: Configure local decoders directory
  ansible.builtin.file:
    path: "{{ wazuh_manager_install_path }}/etc/decoders"
    state: directory
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    mode: '0750'
  become: true

- name: Ensure manager writable directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    mode: '0750'
  loop:
    - "{{ wazuh_manager_install_path }}/etc"
    - "{{ wazuh_manager_install_path }}/logs"
    - "{{ wazuh_manager_install_path }}/queue"
    - "{{ wazuh_manager_install_path }}/var"
    - "{{ wazuh_manager_install_path }}/tmp"
    - "{{ wazuh_manager_install_path }}/stats"
  become: true
  register: manager_writable_directories

- name: Recursively fix manager writable directory ownership
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ wazuh_manager_owner }}"
    group: "{{ wazuh_manager_group }}"
    recurse: true
  loop: "{{ manager_writable_directories.results }}"
  become: true
  when: item.changed
