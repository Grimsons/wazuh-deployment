---
# Wazuh Agent Role - Main Tasks

# The agent role must resolve the release contract on its own: site.yml applies
# roles/package-urls (which includes this file) before the agents, but a
# targeted `wazuh-agents.yml` / canary run does not. Same file, same contract.
- name: Load the shared release contract
  ansible.builtin.include_vars:
    file: ../../vars/main.yml
  tags: always

- name: Fail if the resolved contract did not load
  ansible.builtin.fail:
    msg: |
      CRITICAL: the shared Wazuh release contract (roles/vars/main.yml) did not
      resolve, so the agent cannot tell 4.x from 5.0.

      Expected variables: wazuh_is_5x, wazuh_agent_is_5x,
      wazuh_agent_manager_port. Run the play from the repository root, or
      include roles/vars/main.yml explicitly.
  when: wazuh_agent_is_5x is not defined
  tags: always

- name: Fail closed when Wazuh 5.x lacks direct-download mode
  ansible.builtin.fail:
    msg: >-
      Wazuh 5.x requires wazuh_package_install_mode=direct-download. Refusing
      to configure an apt/yum repository or install from the wrong major.
      Integrate the shared contract in roles/vars/main.yml.
  when:
    - wazuh_agent_is_5x | default(false) | bool
    - (wazuh_package_install_mode | default('repository')) != 'direct-download'
  tags: always

- name: Fail if the host platform is out of scope for this release
  ansible.builtin.fail:
    msg: |
      CRITICAL: {{ ansible_system }} is not a supported Wazuh agent platform.

      Upstream Wazuh {{ wazuh_effective_version }} ships agents for Linux,
      Windows and macOS only. Solaris, AIX and HP-UX have no 5.x package and no
      upstream Ansible support, so there is nothing to deploy here.

      Supported systems: {{ wazuh_agent_supported_systems | join(', ') }}.
      Detected: {{ ansible_system }} ({{ ansible_distribution | default('unknown') }}).
  when:
    - ansible_system not in (wazuh_agent_supported_systems | default(['Linux', 'Windows', 'Darwin']))
    - wazuh_effective_version is defined
  tags: always

- name: Enforce the Wazuh 5.0 upgrade path before touching packages
  ansible.builtin.include_tasks: upgrade_path.yml
  when: (wazuh_agent_is_5x | bool) and (wazuh_agent_upgrade_path_enforced | default(true) | bool)
  tags: always

# 5.0 pre-staging must precede every package task: the 5.0 installer aborts
# before the package manager runs if the manager CA is not already at the
# default trust-anchor path, and a WPK upgrade never rewrites ossec.conf, so
# the 5.0 config has to be in place for the upgraded agent to read.
- name: Pre-stage the Wazuh 5.0 upgrade (trust anchor, enrollment, groups)
  ansible.builtin.include_tasks: prestage_5x.yml
  when: wazuh_agent_is_5x | bool
  tags: always

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      skip: true

- name: Include Linux tasks
  ansible.builtin.include_tasks: linux.yml
  when: ansible_system == 'Linux'

- name: Include Windows tasks
  ansible.builtin.include_tasks: windows.yml
  when: ansible_os_family == 'Windows'

- name: Include macOS tasks
  ansible.builtin.include_tasks: macos.yml
  when: ansible_system == 'Darwin'

- name: Fail if wazuh_manager_nodes is undefined or empty
  ansible.builtin.fail:
    msg: >
      CRITICAL: 'wazuh_manager_nodes' is undefined or empty.

      Define it in group_vars/all/main.yml. Example:

        wazuh_manager_nodes:
          - name: manager-1
            ip: 10.0.0.1
  when: wazuh_manager_nodes is not defined or wazuh_manager_nodes | length == 0
  tags: always

- name: Deploy Root CA certificate for TLS agent communication
  ansible.builtin.include_tasks: certificates.yml
  when: wazuh_agent_tls_enabled | default(true)
