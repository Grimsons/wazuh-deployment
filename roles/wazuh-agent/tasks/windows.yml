---

- name: Windows | Set Wazuh Manager address for agent enrollment
  ansible.builtin.set_fact:
    wazuh_manager_address: "{{ wazuh_agent_registration_address | default(wazuh_manager_nodes[0].ip, true) }}"

- name: Windows | Ensure Wazuh agent download directory exists
  ansible.windows.win_file:
    path: "{{ wazuh_agent_win_package_download_path }}"
    state: directory
  become: true

- name: Windows | Download Wazuh agent installer
  ansible.windows.win_get_url:
    url: "{{ wazuh_agent_windows }}"
    dest: "{{ wazuh_agent_win_package_download_path }}\\{{ wazuh_agent_package_name }}.msi"
  become: true

- name: Windows | Install Wazuh agent
  ansible.windows.win_package:
    path: "{{ wazuh_agent_win_package_download_path }}\\{{ wazuh_agent_package_name }}.msi"
    arguments: '/q WAZUH_MANAGER="{{ wazuh_manager_address }}"'
    state: present
  become: true

- name: Windows | Fail if enrollment password is required but not in vault
  ansible.builtin.fail:
    msg: |
      Agent enrollment password is required but not defined in Ansible vault.

      Please add 'wazuh_agent_enrollment_password' to your Ansible vault:
        ansible-vault edit group_vars/all/vault.yml

      Or set 'wazuh_authd_use_password: false' to disable password-based enrollment.
  when:
    - wazuh_authd_use_password | default(true)
    - wazuh_agent_enrollment_password is not defined or wazuh_agent_enrollment_password | length == 0

- name: Windows | Resolve the enrollment password path
  ansible.builtin.set_fact:
    # 5.0 removes the compiled default authd.pass at package-upgrade time, so
    # the 4.x path cannot be relied on. Both the file and the
    # <authorization_pass_path> in ossec.conf come from this one fact.
    wazuh_agent_authorization_pass_path: >-
      {{ 'C:\Program Files (x86)\ossec-agent\enrollment-auth.pass'
         if (wazuh_agent_is_5x | bool)
         else 'C:\Program Files (x86)\ossec-agent\authd.pass' }}

- name: Windows | Deploy enrollment password file
  ansible.windows.win_copy:
    content: "{{ wazuh_agent_enrollment_password }}"
    # 5.0 removes the compiled default authd.pass at package-upgrade time;
    # an explicitly configured path is operator-owned and survives.
    dest: "{{ wazuh_agent_authorization_pass_path }}"
  no_log: true
  become: true
  when:
    - wazuh_authd_use_password | default(true)
    - wazuh_agent_enrollment_password is defined
    - wazuh_agent_enrollment_password | length > 0

- name: Windows | Restrict the enrollment password file ACL to SYSTEM and Administrators only
  community.windows.win_acl:
    path: "{{ wazuh_agent_authorization_pass_path }}"
    user: "{{ item.user }}"
    rights: "{{ item.rights }}"
    type: allow
    state: present
    inherit: none
    propagation: none
  loop:
    - { user: "SYSTEM", rights: "FullControl" }
    - { user: "Administrators", rights: "FullControl" }
  no_log: true
  become: true
  when:
    - wazuh_authd_use_password | default(true)
    - wazuh_agent_enrollment_password is defined
    - wazuh_agent_enrollment_password | length > 0

- name: Windows | Remove inherited ACEs from the enrollment password file
  community.windows.win_acl_inheritance:
    path: "{{ wazuh_agent_authorization_pass_path }}"
    reorganize: true
    state: absent
  become: true
  when:
    - wazuh_authd_use_password | default(true)
    - wazuh_agent_enrollment_password is defined
    - wazuh_agent_enrollment_password | length > 0

- name: Windows | Deploy the 5.0 enrollment token
  ansible.windows.win_copy:
    content: "{{ wazuh_agent_enrollment_token }}"
    dest: 'C:\Program Files (x86)\ossec-agent\enrollment_token'
  no_log: true
  become: true
  when:
    - wazuh_agent_is_5x | bool
    - wazuh_agent_enrollment_token | default('') | length > 0

- name: Windows | Render the 5.0 agent configuration
  ansible.windows.win_template:
    src: ossec-windows.conf.j2
    dest: 'C:\Program Files (x86)\ossec-agent\ossec.conf'
    owner: SYSTEM
    rights: '0640'
  become: true
  when: wazuh_agent_is_5x | bool
  # No handler: the shared `restart wazuh-agent` handler is systemd, which does
  # not exist on Windows. The explicit stop/start pair below applies the config.

- name: Windows | Stop Wazuh agent service (if already running)
  ansible.windows.win_service:
    name: "Wazuh"
    state: stopped
  become: true

- name: Windows | Start Wazuh agent service
  ansible.windows.win_service:
    name: "Wazuh"
    state: started
  become: true

- name: Windows | Delete Wazuh agent download directory
  ansible.windows.win_file:
    path: "{{ wazuh_agent_win_package_download_path }}"
    state: absent
  become: true
