---

- name: Load the artifact manifest for Wazuh 5.x
  ansible.builtin.include_vars:
    file: "../../vars/{{ urls_file }}"
  when: wazuh_is_5x | default(false) | bool
# Wazuh Agent - Linux Tasks

- name: Install Wazuh Agent from the 5.x artifact manifest
  ansible.builtin.include_tasks: ../../package-urls/tasks/direct-install.yml
  vars:
    wazuh_package_component: wazuh-agent
    wazuh_package_notify_handler: restart wazuh-agent
  when: (wazuh_package_install_mode | default('repository')) == 'direct-download'

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'

- name: Ensure keyrings directory exists (Debian/Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'

- name: Download Wazuh GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: "{{ wazuh_repo_gpg_key }}"
    dest: /etc/apt/keyrings/wazuh.gpg
    mode: '0644'
  become: true
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'

- name: Dearmor Wazuh GPG key if needed (Debian/Ubuntu)
  ansible.builtin.shell: |
    set -o pipefail
    if head -c 5 /etc/apt/keyrings/wazuh.gpg | grep -q '^\-\-\-\-\-'; then
      gpg --dearmor < /etc/apt/keyrings/wazuh.gpg > /etc/apt/keyrings/wazuh.gpg.tmp && mv /etc/apt/keyrings/wazuh.gpg.tmp /etc/apt/keyrings/wazuh.gpg
      echo "Key dearmored"
    else
      echo "Key already in binary format"
    fi
  args:
    executable: /bin/bash
  become: true
  register: dearmor_result
  changed_when: "'dearmored' in dearmor_result.stdout"
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'

- name: Remove legacy apt-key entry if present (Debian/Ubuntu)
  ansible.builtin.apt_key:
    url: "{{ wazuh_repo_gpg_key }}"
    state: absent
  become: true
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  ignore_errors: true

- name: Add Wazuh repository with signed-by (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/wazuh.gpg] {{ wazuh_repo_url_apt }} stable main"
    state: present
    filename: wazuh
    update_cache: true
  become: true
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'

- name: Import Wazuh GPG key (RHEL/CentOS)
  ansible.builtin.rpm_key:
    key: "{{ wazuh_repo_gpg_key }}"
    state: present
  become: true
  when: ansible_os_family == 'RedHat'

- name: Add Wazuh repository (RHEL/CentOS)
  ansible.builtin.yum_repository:
    name: wazuh
    description: Wazuh repository
    baseurl: "{{ wazuh_repo_url_yum }}"
    gpgcheck: true
    gpgkey: "{{ wazuh_repo_gpg_key }}"
    enabled: true
  become: true
  when: ansible_os_family == 'RedHat'

- name: Set Wazuh Manager address for agent enrollment
  ansible.builtin.set_fact:
    wazuh_manager_address: "{{ wazuh_agent_registration_address | default(wazuh_manager_nodes[0].ip, true) }}"

- name: Download and install Wazuh Agent via .deb (pre-release)
  when:
    - ansible_os_family == 'Debian'
    - wazuh_direct_download | default(false)
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  become: true
  block:
    - name: Create temp directory for packages
      ansible.builtin.file:
        path: /tmp/wazuh-packages
        state: directory
        mode: '0755'

    - name: Download Wazuh Agent .deb package
      ansible.builtin.get_url:
        url: "{{ wazuh_agent_amd64_deb }}"
        dest: "{{ wazuh_agent_package_download_path }}/wazuh-agent.deb"
        checksum: "{{ wazuh_agent_amd64_deb_sha256 | default(omit) }}"

    - name: Install .deb package
      ansible.builtin.apt:
        deb: "{{ wazuh_agent_package_download_path }}/wazuh-agent.deb"
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager_address }}"
      notify: restart wazuh-agent

- name: Install Wazuh Agent via apt repository (production)
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_version }}-*"
    state: present
    update_cache: true
    allow_downgrades: true
  become: true
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_address }}"
  when:
    - ansible_os_family == 'Debian'
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  notify: restart wazuh-agent

- name: Download and install Wazuh Agent via .rpm (pre-release)
  when:
    - ansible_os_family == 'RedHat'
    - wazuh_direct_download | default(false)
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  become: true
  block:
    - name: Create temp directory for packages
      ansible.builtin.file:
        path: /tmp/wazuh-packages
        state: directory
        mode: '0755'

    - name: Download Wazuh Agent .rpm package
      ansible.builtin.get_url:
        url: "{{ wazuh_agent_x86_64_rpm }}"
        dest: "{{ wazuh_agent_package_download_path }}/wazuh-agent.rpm"
        checksum: "{{ wazuh_agent_x86_64_rpm_sha256 | default(omit) }}"

    - name: Install .rpm package
      ansible.builtin.dnf:
        name: "{{ wazuh_agent_package_download_path }}/wazuh-agent.rpm"
        state: present
        disable_gpg_check: true
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager_address }}"
      notify: restart wazuh-agent

- name: Install Wazuh Agent via dnf repository (production)
  ansible.builtin.dnf:
    name: "wazuh-agent-{{ wazuh_version }}"
    state: present
  become: true
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_address }}"
  when:
    - ansible_os_family == 'RedHat'
    - (wazuh_package_install_mode | default('repository')) == 'repository'
  notify: restart wazuh-agent

# ─────────────────────────────────────────────────────────────
# Auditd Integration - Syscall-level monitoring for MITRE ATT&CK
# ─────────────────────────────────────────────────────────────
- name: Install auditd package (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
  become: true
  when:
    - wazuh_agent_auditd_enabled | default(true)
    - ansible_os_family == 'Debian'

- name: Install auditd package (RHEL/CentOS)
  ansible.builtin.dnf:
    name:
      - audit
      - audit-libs
    state: present
  become: true
  when:
    - wazuh_agent_auditd_enabled | default(true)
    - ansible_os_family == 'RedHat'

- name: Deploy Wazuh auditd rules
  ansible.builtin.copy:
    src: audit-wazuh.rules
    dest: /etc/audit/rules.d/wazuh.rules
    owner: root
    group: root
    mode: '0640'
  become: true
  when:
    - wazuh_agent_auditd_enabled | default(true)
    - wazuh_agent_auditd_rules_deploy | default(true)
  notify: restart auditd

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  become: true
  when: wazuh_agent_auditd_enabled | default(true)
  ignore_errors: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Configure Wazuh Agent
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: "{{ wazuh_agent_config_path }}"
    owner: root
    group: wazuh
    mode: '0640'
    backup: true
  become: true
  notify: restart wazuh-agent

- name: Fail if enrollment password is required but not in vault
  ansible.builtin.fail:
    msg: |
      Agent enrollment password is required but not defined in Ansible vault.

      Please add 'wazuh_agent_enrollment_password' to your Ansible vault:
        ansible-vault edit group_vars/all/vault.yml

      Or set 'wazuh_authd_use_password: false' to disable password-based enrollment.
  when:
    - wazuh_authd_use_password | default(true)
    - wazuh_agent_enrollment_password is not defined or wazuh_agent_enrollment_password | length == 0

- name: Deploy enrollment password file to agent
  ansible.builtin.copy:
    content: "{{ wazuh_agent_enrollment_password }}"
    # 5.0 deletes the compiled default authd.pass on package upgrade, so a
    # 4.x-era file there is gone by the time the 5.0 agent starts. A path
    # configured explicitly is operator-owned and survives the upgrade.
    dest: "{{ wazuh_agent_authorization_pass_path if (wazuh_agent_is_5x | bool) else '/var/ossec/etc/authd.pass' }}"
    owner: root
    group: wazuh
    mode: '0640'
  become: true
  no_log: true
  when:
    - wazuh_authd_use_password | default(true)
    - wazuh_agent_enrollment_password is defined
    - wazuh_agent_enrollment_password | length > 0

- name: Deploy the 5.0 enrollment token
  ansible.builtin.copy:
    content: "{{ wazuh_agent_enrollment_token }}"
    dest: "{{ wazuh_agent_enrollment_token_path }}"
    owner: root
    group: wazuh
    mode: '0600'
  become: true
  no_log: true
  when:
    - wazuh_agent_is_5x | bool
    - wazuh_agent_enrollment_token | default('') | length > 0

- name: Enable Wazuh Agent service
  ansible.builtin.systemd:
    name: "{{ wazuh_agent_service_name }}"
    enabled: true
    daemon_reload: true
  become: true

- name: Start Wazuh Agent service (non-blocking)
  ansible.builtin.systemd:
    name: "{{ wazuh_agent_service_name }}"
    state: started
    no_block: true
  become: true

- name: Verify Wazuh Agent service is running
  ansible.builtin.systemd:
    name: "{{ wazuh_agent_service_name }}"
  become: true
  register: agent_service_start
  until: agent_service_start.status.ActiveState == "active"
  retries: 30
  delay: 5
  ignore_errors: true

- name: Get agent service status if start failed
  ansible.builtin.command: systemctl status wazuh-agent --no-pager -l
  become: true
  register: agent_status
  changed_when: false
  failed_when: false
  when: agent_service_start.failed | default(false)

- name: Get agent journal logs if start failed
  ansible.builtin.command: journalctl -u wazuh-agent --no-pager -n 50
  become: true
  register: agent_journal
  changed_when: false
  failed_when: false
  when: agent_service_start.failed | default(false)

- name: Get agent ossec.log if start failed
  ansible.builtin.command: tail -100 /var/ossec/logs/ossec.log
  become: true
  register: agent_ossec_log
  changed_when: false
  failed_when: false
  when: agent_service_start.failed | default(false)

- name: Display agent diagnostic info
  ansible.builtin.debug:
    msg: |
      === Service Status ===
      {{ agent_status.stdout | default('No status available') }}

      === Journal Logs ===
      {{ agent_journal.stdout | default('No logs available') }}

      === OSSEC Log ===
      {{ agent_ossec_log.stdout | default('No ossec.log available') }}
  when: agent_service_start.failed | default(false)

- name: Fail if agent service did not start
  ansible.builtin.fail:
    msg: "Wazuh Agent failed to start. See diagnostic info above."
  when: agent_service_start.failed | default(false)

- name: Wait for agent to connect to manager
  ansible.builtin.wait_for:
    path: /var/ossec/var/run/wazuh-agentd.state
    state: present
    timeout: 120
  become: true
  ignore_errors: true
