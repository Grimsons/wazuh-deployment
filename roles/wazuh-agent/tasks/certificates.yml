---
# Wazuh Agent - Certificate Deployment
# Deploys Root CA certificate for TLS agent-to-manager communication.
# Primary: copy from control node (wazuh_certs_path).
# Fallback: fetch from first manager node (already has root-ca.pem deployed).
#
# Mode matters on 5.0: etc/certs/root-ca.pem is the agent's trust anchor and it
# is read by the daemon as the wazuh user, so the file has to be 0640 root:wazuh.
# At 0400 the group has no read and the agent treats the anchor exactly as if it
# were absent - it then connects without verifying the manager and the 5.0
# installer refuses the upgrade for the same reason.

- name: Resolve the manager-side trust anchor path
  ansible.builtin.set_fact:
    manager_ca_path: >-
      {{ '/var/wazuh-manager/etc/certs/root-ca.pem'
         if (wazuh_is_5x | default(false) | bool)
         else '/var/ossec/etc/certs/root-ca.pem' }}

- name: Set certificate paths per platform
  ansible.builtin.set_fact:
    agent_certs_dir: >-
      {{ '/var/ossec/etc/certs' if ansible_system == 'Linux'
       else '/Library/Ossec/etc/certs' if ansible_system == 'Darwin'
       else 'C:\Program Files (x86)\ossec-agent\certs' }}
    # Resolved once in defaults, so the deployed file and the path named in
    # ossec.conf come from the same expression. (Not derived with | dirname:
    # that mangles the backslashes in the Windows path.)
    agent_ca_path: "{{ wazuh_agent_trust_anchor_path }}"

- name: Create certificates directory (Linux/macOS)
  ansible.builtin.file:
    path: "{{ agent_certs_dir }}"
    state: directory
    owner: root
    group: wazuh
    mode: '0750'
  become: true
  when: ansible_os_family != 'Windows'

- name: Create certificates directory (Windows)
  ansible.windows.win_file:
    path: "{{ agent_certs_dir }}"
    state: directory
  when: ansible_os_family == 'Windows'

- name: Copy Root CA from control node (Linux/macOS)
  ansible.builtin.copy:
    src: "{{ wazuh_certs_path | default('files/certs') }}/root-ca.pem"
    dest: "{{ agent_ca_path }}"
    owner: root
    group: wazuh
    mode: '0640'
  become: true
  register: ca_copy_result
  ignore_errors: true
  when: ansible_os_family != 'Windows'

- name: Copy Root CA from control node (Windows)
  ansible.windows.win_copy:
    src: "{{ wazuh_certs_path | default('files/certs') }}/root-ca.pem"
    dest: "{{ agent_ca_path }}"
  when: ansible_os_family == 'Windows'
  register: ca_copy_win_result
  ignore_errors: true

- name: Fallback — slurp Root CA from first manager node
  ansible.builtin.slurp:
    src: "{{ manager_ca_path }}"
  register: ca_slurp
  delegate_to: "{{ wazuh_manager_nodes[0].name }}"
  ignore_errors: true
  when:
    - ansible_os_family != 'Windows'
    - ca_copy_result.failed | default(false)

- name: Fallback — write Root CA to agent (Linux/macOS)
  ansible.builtin.copy:
    content: "{{ ca_slurp.content | b64decode }}"
    dest: "{{ agent_ca_path }}"
    owner: root
    group: wazuh
    mode: '0640'
  become: true
  when:
    - ansible_os_family != 'Windows'
    - ca_copy_result.failed | default(false)
    - ca_slurp is defined
    - ca_slurp.content is defined

- name: Fallback — slurp Root CA from manager (Windows)
  ansible.builtin.slurp:
    src: "{{ manager_ca_path }}"
  register: ca_slurp_win
  delegate_to: "{{ wazuh_manager_nodes[0].name }}"
  ignore_errors: true
  when:
    - ansible_os_family == 'Windows'
    - ca_copy_win_result.failed | default(false)

- name: Fallback — write Root CA to agent (Windows)
  ansible.builtin.copy:
    content: "{{ ca_slurp_win.content | b64decode }}"
    dest: "{{ agent_ca_path }}"
  when:
    - ansible_os_family == 'Windows'
    - ca_copy_win_result.failed | default(false)
    - ca_slurp_win is defined
    - ca_slurp_win.content is defined

- name: Warn if Root CA could not be deployed
  ansible.builtin.debug:
    msg: >
      WARNING: Root CA certificate could not be deployed to agent.
      Agent TLS will fail until root-ca.pem is manually placed at {{ agent_ca_path }}.
      Either run from the Ansible control node with certs in {{ wazuh_certs_path | default('files/certs') }},
      or ensure the first manager node has {{ manager_ca_path }} deployed.
  when:
    - ca_copy_result.failed | default(false) or ca_copy_win_result.failed | default(false)
    - ca_slurp.content is not defined and ca_slurp_win.content is not defined
