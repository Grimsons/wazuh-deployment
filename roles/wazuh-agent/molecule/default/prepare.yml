---
- name: Prepare certificates for standalone test
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Get project root from git
      ansible.builtin.command:
        cmd: git rev-parse --show-toplevel
      register: git_root
      changed_when: false

    - name: Create group_vars for certificate generation
      ansible.builtin.copy:
        dest: "{{ git_root.stdout }}/group_vars/all/main.yml"
        content: |
          wazuh_indexer_nodes:
            - name: indexer-1
              ip: 127.0.0.1
          wazuh_manager_nodes:
            - name: manager-1
              ip: 127.0.0.1

    - name: Clean stale certificates from previous runs
      ansible.builtin.file:
        path: "{{ git_root.stdout }}/files/certs"
        state: absent

    - name: Generate self-signed certificates
      ansible.builtin.command:
        cmd: bash generate-certs.sh
        chdir: "{{ git_root.stdout }}"
      changed_when: false

    - name: Verify root CA was created
      ansible.builtin.stat:
        path: "{{ git_root.stdout }}/files/certs/root-ca.pem"
      register: ca_check
      failed_when: not ca_check.stat.exists

    - name: Ensure role files directory exists for cert symlink
      ansible.builtin.file:
        path: "{{ git_root.stdout }}/roles/wazuh-agent/files"
        state: directory

    - name: Symlink certs into role files directory for copy module access
      ansible.builtin.file:
        src: "{{ git_root.stdout }}/files/certs"
        dest: "{{ git_root.stdout }}/roles/wazuh-agent/files/certs"
        state: link
