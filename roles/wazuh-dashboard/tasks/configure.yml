---
# Wazuh Dashboard - Configuration
# All credentials are sourced from Ansible Vault via group_vars

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ wazuh_dashboard_log_path }}"
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: '0750'
  become: true

- name: Configure opensearch_dashboards.yml from template
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: /etc/wazuh-dashboard/opensearch_dashboards.yml
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: '0640'
    backup: true
  become: true
  no_log: true
  notify: restart wazuh-dashboard

- name: Ensure dashboard data directory exists
  ansible.builtin.file:
    path: /usr/share/wazuh-dashboard/data
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: '0750'
  become: true

- name: Ensure wazuh plugin data directory exists
  ansible.builtin.file:
    path: /usr/share/wazuh-dashboard/data/wazuh
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: '0750'
  become: true

- name: Ensure wazuh plugin config directory exists
  ansible.builtin.file:
    path: /usr/share/wazuh-dashboard/data/wazuh/config
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: '0750'
  become: true
  when: not (wazuh_is_5x | default(false) | bool)

# Wazuh 5.0 moved the Wazuh plugin settings into opensearch_dashboards.yml
# (wazuh_core.hosts and friends) and stopped reading wazuh.yml entirely. A file
# full of 4.x keys that the plugin never reads is worse than no file: it looks
# authoritative and every setting in it is inert. Removing it also makes the
# rollback path honest - a 4.x rollback re-renders it from wazuh.yml.j2.
- name: Remove the 4.x wazuh.yml that Wazuh 5.x no longer reads
  ansible.builtin.file:
    path: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    state: absent
  become: true
  when: wazuh_is_5x | default(false) | bool
  register: wazuh_dashboard_legacy_config_removed

- name: Configure wazuh.yml from template
  ansible.builtin.template:
    src: wazuh.yml.j2
    dest: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: '0640'
  become: true
  no_log: true
  notify: restart wazuh-dashboard
  when: not (wazuh_is_5x | default(false) | bool)

- name: Set correct ownership on wazuh plugin data directory
  ansible.builtin.file:
    path: /usr/share/wazuh-dashboard/data/wazuh
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    recurse: true
  become: true

- name: Set correct ownership on config directory
  ansible.builtin.file:
    path: "{{ wazuh_dashboard_config_path }}"
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    recurse: true
  become: true

- name: Allow Dashboard to bind to privileged port (if < 1024)
  ansible.builtin.command: setcap 'cap_net_bind_service=+ep' /usr/share/wazuh-dashboard/node/bin/node
  become: true
  changed_when: false
  when: wazuh_dashboard_port | int < 1024
