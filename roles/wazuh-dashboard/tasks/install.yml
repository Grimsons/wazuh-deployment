---
# Wazuh Dashboard - Installation

- name: Download and install Wazuh Dashboard via .deb (pre-release)
  when:
    - ansible_os_family == 'Debian'
    - wazuh_direct_download | default(false)
  become: true
  block:
    - name: Create temp directory for packages
      ansible.builtin.file:
        path: /tmp/wazuh-packages
        state: directory
        mode: '0755'

    - name: Download Wazuh Dashboard .deb package
      ansible.builtin.get_url:
        url: "{{ wazuh_repo_url_apt }}pool/main/w/wazuh-dashboard/wazuh-dashboard_{{ wazuh_version }}_amd64.deb"
        dest: /tmp/wazuh-packages/wazuh-dashboard.deb

    - name: Install .deb package
      ansible.builtin.apt:
        deb: /tmp/wazuh-packages/wazuh-dashboard.deb
      notify: restart wazuh-dashboard

- name: Install Wazuh Dashboard via apt repository (production)
  ansible.builtin.apt:
    name: "wazuh-dashboard={{ wazuh_version }}-*"
    state: present
    update_cache: true
  become: true
  when:
    - ansible_os_family == 'Debian'
    - not (wazuh_direct_download | default(false))
  notify: restart wazuh-dashboard

- name: Download and install Wazuh Dashboard via .rpm (pre-release)
  when:
    - ansible_os_family == 'RedHat'
    - wazuh_direct_download | default(false)
  become: true
  block:
    - name: Create temp directory for packages
      ansible.builtin.file:
        path: /tmp/wazuh-packages
        state: directory
        mode: '0755'

    - name: Download Wazuh Dashboard .rpm package
      ansible.builtin.get_url:
        url: "{{ wazuh_repo_url_yum }}wazuh-dashboard-{{ wazuh_version }}.x86_64.rpm"
        dest: /tmp/wazuh-packages/wazuh-dashboard.rpm

    - name: Install .rpm package
      ansible.builtin.dnf:
        name: /tmp/wazuh-packages/wazuh-dashboard.rpm
        state: present
        disable_gpg_check: true
      notify: restart wazuh-dashboard

- name: Install Wazuh Dashboard via dnf repository (production)
  ansible.builtin.dnf:
    name: "wazuh-dashboard-{{ wazuh_version }}"
    state: present
  become: true
  when:
    - ansible_os_family == 'RedHat'
    - not (wazuh_direct_download | default(false))
  notify: restart wazuh-dashboard

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
