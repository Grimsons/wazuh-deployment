name: wazuh-test

services:
  indexer-1:
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    hostname: indexer-1
    container_name: indexer-1
    privileged: true
    cgroup: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    networks:
      wazuh-net:
        ipv4_address: 172.18.0.2
    ports:
      - "2201:22"
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active sshd.service || systemctl is-active ssh.service || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  manager-1:
    image: geerlingguy/docker-rockylinux9-ansible:latest
    hostname: manager-1
    container_name: manager-1
    privileged: true
    cgroup: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/lib/systemd/systemd
    networks:
      wazuh-net:
        ipv4_address: 172.18.0.3
    ports:
      - "2202:22"
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active sshd.service || systemctl is-active ssh.service || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard-1:
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    hostname: dashboard-1
    container_name: dashboard-1
    privileged: true
    cgroup: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    networks:
      wazuh-net:
        ipv4_address: 172.18.0.4
    ports:
      - "2203:22"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active sshd.service || systemctl is-active ssh.service || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-1:
    image: geerlingguy/docker-rockylinux9-ansible:latest
    hostname: agent-1
    container_name: agent-1
    privileged: true
    cgroup: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/lib/systemd/systemd
    networks:
      wazuh-net:
        ipv4_address: 172.18.0.5
    ports:
      - "2204:22"
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active sshd.service || systemctl is-active ssh.service || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  wazuh-net:
    driver: bridge
    ipam:
      config:
        - subnet: "172.18.0.0/16"
